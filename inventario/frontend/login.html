<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Inventário Embarcados</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: var(--bg);
    }
    .login-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 2rem;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .login-logo .logo-title {
      font-size: 1.5rem;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-logo">
      <div class="logo-tag">// sistema</div>
      <div class="logo-title">Estoque<span>Embarcados</span></div>
    </div>
    
    <div id="login-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="seu@email.com" required/>
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="password" placeholder="••••••••" required/>
      </div>
      <div class="modal-actions" style="margin-top: 1rem;">
        <button class="btn btn-primary" style="width: 100%;" onclick="fazerLogin()">Entrar</button>
      </div>
      <div id="erro-login" style="color: var(--red); margin-top: 1rem; text-align: center; font-size: 0.9rem; display: none;">
        Credenciais inválidas.
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/login.js"></script>
</body>
</html>
