<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Componentes — Inventário Embarcados</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <aside class="sidebar">
    <div class="logo">
      <div class="logo-tag">// sistema</div>
      <div class="logo-title">Estoque<span>Embarcados</span></div>
    </div>
    <nav>
      <div class="nav-section">// navegação</div>
      <a href="index.html" class="nav-item">
        <span class="nav-icon">⬡</span> Dashboard
      </a>
      <a href="usuarios.html" class="nav-item">
        <span class="nav-icon">◈</span> Usuários
      </a>
      <a href="componentes.html" class="nav-item active">
        <span class="nav-icon">◧</span> Componentes
        <span class="status-dot"></span>
      </a>
      <a href="fornecedores.html" class="nav-item">
        <span class="nav-icon">◫</span> Fornecedores
      </a>
      <a href="movimentacoes.html" class="nav-item">
        <span class="nav-icon">⇅</span> Movimentações
      </a>
      <a href="componentes_fornecedores.html" class="nav-item">
        <span class="nav-icon">⬡</span> Comp. × Fornecedor
        </a>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="page-title">
        <span>// componentes</span>
        Componentes
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" onclick="abrirModal()">+ Novo Componente</button>
      </div>
    </div>

    <div class="content">
      <div class="section-header">
        <div class="section-label">// lista de componentes</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Valor (R$)</th>
              <th>Descrição</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-componentes">
            <tr><td colspan="5" style="color:var(--muted);text-align:center">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-title">
        <span id="modal-tag">// novo</span>
        <span id="modal-titulo">Novo Componente</span>
      </div>
      <div class="form-group">
        <label>Nome</label>
        <input type="text" id="campo-nome" placeholder="ex: Resistor 10kΩ"/>
      </div>
      <div class="form-group">
        <label>Valor (R$)</label>
        <input type="number" id="campo-valor" step="0.01" placeholder="0.00"/>
      </div>
      <div class="form-group">
        <label>Descrição</label>
        <input type="text" id="campo-descricao" placeholder="Descrição do componente"/>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvar()">Salvar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/componentes.js"></script>
</body>
</html>
