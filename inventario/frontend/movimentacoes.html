<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Movimentações — Inventário Embarcados</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <aside class="sidebar">
    <div class="logo">
      <div class="logo-tag">// sistema</div>
      <div class="logo-title">Estoque<span>Embarcados</span></div>
    </div>
    <nav>
      <div class="nav-section">// navegação</div>
      <a href="index.html" class="nav-item">
        <span class="nav-icon">⬡</span> Dashboard
      </a>
      <a href="usuarios.html" class="nav-item">
        <span class="nav-icon">◈</span> Usuários
      </a>
      <a href="componentes.html" class="nav-item">
        <span class="nav-icon">◧</span> Componentes
      </a>
      <a href="fornecedores.html" class="nav-item">
        <span class="nav-icon">◫</span> Fornecedores
      </a>
      <a href="movimentacoes.html" class="nav-item active">
        <span class="nav-icon">⇅</span> Movimentações
        <span class="status-dot"></span>
      </a>
      <a href="componentes_fornecedores.html" class="nav-item">
        <span class="nav-icon">⬡</span> Comp. × Fornecedor
      </a>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="page-title">
        <span>// movimentações</span>
        Movimentações
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" onclick="abrirModal()">+ Nova Movimentação</button>
      </div>
    </div>

    <div class="content">
      <div class="section-header">
        <div class="section-label">// histórico de movimentações</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Componente</th>
              <th>Usuário</th>
              <th>Tipo</th>
              <th>Quantidade</th>
              <th>Valor Total (R$)</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody id="tabela-movimentacoes">
            <tr><td colspan="7" style="color:var(--muted);text-align:center">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-title">
        <span>// nova</span>
        Nova Movimentação
      </div>
      <div class="form-group">
        <label>Componente</label>
        <select id="campo-componente" onchange="calcularValor()"></select>
      </div>
      <div class="form-group">
        <label>Usuário</label>
        <select id="campo-usuario"></select>
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select id="campo-tipo">
          <option value="1">Entrada</option>
          <option value="0">Saída</option>
        </select>
      </div>
      <div class="form-group">
        <label>Quantidade</label>
        <input type="number" id="campo-quantidade" placeholder="ex: 100" oninput="calcularValor()"/>
      </div>
      <div class="form-group">
        <label>Valor Total (R$) — calculado automaticamente</label>
        <input type="number" id="campo-valor" step="0.01" placeholder="0.00" readonly style="opacity:0.6;cursor:not-allowed"/>
      </div>
      <div class="form-group">
        <label>Data</label>
        <input type="date" id="campo-data"/>
      </div>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="salvar()">Registrar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/movimentacoes.js"></script>
</body>
</html>
